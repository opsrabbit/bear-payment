name: Build & Push

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to Pi after build'
        required: false
        type: boolean
        default: true
      namespace:
        description: 'Kubernetes namespace (default: autosre-default)'
        required: false
        type: string
        default: autosre-default

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: opsrabbit/bear-payment

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
    - uses: actions/checkout@v4

    - id: vars
      run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

    - uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3

    - name: Build and push (multi-arch)
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'push' || inputs.deploy != false }}
    env:
      NAMESPACE: ${{ inputs.namespace || 'autosre-default' }}
      TAG: ${{ needs.build.outputs.short_sha }}
    steps:
    - name: Connect to Tailscale
      uses: tailscale/github-action@v3
      with:
        authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.PI_SSH_KEY }}" > ~/.ssh/pi-key.pem
        chmod 600 ~/.ssh/pi-key.pem
        cat > ~/.ssh/config << SSHEOF
        Host pi
          HostName ${{ secrets.PI_HOST }}
          User ${{ secrets.PI_USER }}
          Port ${{ secrets.PI_PORT }}
          IdentityFile ~/.ssh/pi-key.pem
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
          ServerAliveInterval 30
          ServerAliveCountMax 10
        SSHEOF
        chmod 600 ~/.ssh/config
        ssh pi "echo 'SSH OK' && hostname"

    - name: Pull image on Pi
      run: |
        GHCR_USER='${{ github.actor }}'
        GHCR_PASSWORD='${{ secrets.GITHUB_TOKEN }}'
        IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
        ssh pi "sudo k3s ctr images pull --user '${GHCR_USER}:${GHCR_PASSWORD}' '${IMG}' 2>&1 | tail -2"

    - name: Deploy to k3s
      run: |
        IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
        ssh pi << ENDSSH
          set -e
          echo "Deploying bear-payment:${TAG} to namespace ${NAMESPACE}..."
          kubectl -n ${NAMESPACE} set image deployment/bear-payment bear-payment=${IMG}
          kubectl -n ${NAMESPACE} rollout status deployment/bear-payment --timeout=120s
          echo "✅ bear-payment deployed: ${TAG}"
          kubectl -n ${NAMESPACE} get pods --no-headers | grep bear-payment
        ENDSSH
